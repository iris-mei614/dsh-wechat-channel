name: 问题反馈
description: 报告异常行为，请勿提交凭据或聊天记录
title: "[Bug] "
body:
  - type: textarea
    id: versions
    attributes:
      label: 环境版本
      description: 插件版本、DSH 版本、Node.js 版本、操作系统
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、预期与实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: 脱敏诊断报告
      description: 使用 /doctor 或 wechat_doctor；不要上传 state.json、Token、二维码或消息正文
